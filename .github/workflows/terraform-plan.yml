name: Terraform DEV plan

# 수동 실행만 허용한다. AWS 인증이 필요한 plan은 공개 PR에서 실행하지 않는다.
on:
  workflow_dispatch:

permissions: {}

jobs:
  plan:
    # 이 워크플로 버전은 dev 브랜치의 Terraform plan에만 사용한다.
    if: github.repository == 'urineun-jigeum-bildeujung/infra' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev-plan
    concurrency:
      group: terraform-dev-plan
      cancel-in-progress: false
    permissions:
      contents: read
    defaults:
      run:
        working-directory: terraform/environments/dev
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      # Secret 원문이 아닌 ARN만 GitHub Environment 변수로 전달한다.
      TAILSCALE_OAUTH_SECRET_ARN: ${{ vars.TAILSCALE_OAUTH_SECRET_ARN }}

    steps:
      - uses: actions/checkout@v4

      - name: Check required configuration
        run: |
          test -n "$TAILSCALE_OAUTH_SECRET_ARN" || { echo 'dev-plan 변수 TAILSCALE_OAUTH_SECRET_ARN이 필요합니다.' >&2; exit 1; }

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.9
          terraform_wrapper: false

      - name: Assume shared Terraform role using environment secrets
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          # dev-plan 승인 후 IAM 사용자 키로 기존 공용 Terraform Role을 Assume한다.
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: arn:aws:iam::297165773875:role/petflow-terraform-execution
          role-session-name: terraform-plan-${{ github.run_id }}
          role-skip-session-tagging: true
          aws-region: ap-northeast-2
          allowed-account-ids: '297165773875'

      - name: Initialize remote state
        run: terraform init -input=false -lockfile=readonly -backend-config=backend.hcl.example

      - name: Validate
        run: terraform validate -no-color

      # plan 결과는 로그에서만 확인한다. 민감할 수 있는 plan 파일을 artifact로 업로드하지 않는다.
      - name: Show planned changes (no apply)
        run: |
          terraform plan -input=false -no-color -lock-timeout=5m \
            -var-file=terraform.tfvars.example \
            -var="tailscale_oauth_secret_arn=${TAILSCALE_OAUTH_SECRET_ARN}"
