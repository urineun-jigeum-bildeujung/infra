# karpenter-nodepool.yaml
#
# EC2NodeClass는 만들지 않는다. 팀이 이미 "default"라는 이름으로
# karpenter-config GitOps Application을 통해 관리 중이다(AMI 고정,
# blockDeviceMappings, IMDSv2 강제 등 세부 설정 포함). 같은 이름으로
# 다시 만들면 GitOps selfHeal과 충돌해 되돌리기가 반복될 수 있다.
# 아래 NodePool은 nodeClassRef로 그 기존 "default"를 그대로 참조한다.
#
# 팀이 이미 운영 중인 NodePool "on-demand"와 비교해 맞춘 것:
#   - node-role: workload 라벨을 동일하게 부여 (다른 리소스가 이 라벨로
#     "워크로드용 노드"를 찾을 수 있으므로 누락하면 스케줄이 안 될 수 있음)
#   - weight를 "on-demand"(10)보다 높게(50) 줘서 Spot을 우선 사용하도록 함
#     (비용 절감이 목표이므로 같은 요청이면 Spot 풀을 먼저 고려하게 함)
#   - disruption.budgets, terminationGracePeriod는 팀 쪽 값을 그대로 따름

apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: spot-cost-optimized
spec:
  template:
    metadata:
      labels:
        capacity-type: spot
        node-role: workload
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default # 팀이 이미 관리하는 EC2NodeClass 참조 (새로 만들지 않음)
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["c7i-flex", "m7i-flex", "c7i", "m7i"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["large", "xlarge"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
      expireAfter: 720h
      terminationGracePeriod: 30m
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 10m
    budgets:
      - nodes: "1"
  limits:
    cpu: "16"
    memory: 64Gi
  weight: 50