      metadata:
        bootstrapServers: kafka.kafka.svc.cluster.local:9092
        consumerGroup: notification-service-group
        # TODO 확인 필요: 실제 토픽명(알림 트리거용 토픽)으로 교체
        topic: notifications
        lagThreshold: "100"
        offsetResetPolicy: latest
      authenticationRef:
        name: kafka-auth
