# 팀 컨벤션: 서비스마다 개별 네임스페이스 사용 (workload-iam 모듈의
# image-uploads.tf에서 namespace: review-service, member-service로 확인됨).
# 공유 "msa" 네임스페이스 대신 서비스별로 분리했습니다.
#
# TODO 확인 필요: 서비스 목록/이름이 실제와 다르면 교체하세요.

apiVersion: v1
kind: Namespace
metadata:
  name: auth-service
  labels:
    monitoring: enabled
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
