---
# 각 네임스페이스에 동일한 기본 상한 적용 (서비스별 실측치 나오면 개별 조정)
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: auth-service-quota
  namespace: auth-service
spec:
  hard:
    requests.cpu: "10"
    requests.memory: 20Gi
    limits.cpu: "20"
    limits.memory: 40Gi
    pods: "50"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: auth-service-default-limits
  namespace: auth-service
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: 512Mi
      defaultRequest:
        cpu: "200m"
        memory: 256Mi
---
