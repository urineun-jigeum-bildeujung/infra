# ============================================================
# HPA + PDB — CPU 기준 스케일링 대상 서비스
# (외부 이벤트 소스 없는 단순 REST API 서비스: auth, member, product, review)
# order/payment/notification 은 이번 범위에서 제외 (replicas 고정).
# Kafka 기반 KEDA 스케일링은 별도 작업으로 미룬다 (keda-scaledobject.yaml 은 적용하지 않는다).
#
# 실제 클러스터 확인 결과 반영:
#  - auth-service          : Argo Rollouts (Rollout)
#  - member/product/review : Deployment
#  - 파드 라벨             : app.kubernetes.io/name=generic-service
#  - 컨트롤러 이름         : generic-service
#
# DB 커넥션 예산 (PostgreSQL max_connections 100, 앱 사용 가능 97):
#  파드당 Hikari 풀 3(minimumIdle 1) 기준 -- 차트 values 에서 먼저 반영되어 있어야 한다.
#  HPA 대상 4개 서비스 x maxReplicas 3 x 풀 3 = 36
#  order/payment/notification 고정 1파드 x 풀 3 x 3 = 9
#  합계 최대 약 45 / 97
#  maxReplicas 나 풀 크기를 올리면 이 예산을 다시 계산할 것.
#
# 적용 전 필수 조건:
#  1) 서비스 차트에서 SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=3, MINIMUM_IDLE=1 반영
#  2) 4개 서비스의 ArgoCD Application 에 /spec/replicas ignoreDifferences 추가
#     (selfHeal 이 켜져 있어 없으면 HPA 와 계속 싸운다)
#  3) 서비스 CPU requests 를 실제 사용량에 맞게 조정 (현재 100m, 부하 시 360~500m 사용)
#
# memory 메트릭은 뺐다. 유휴 상태에서도 requests(128Mi) 를 크게 넘는 앱이라
# 파드를 늘려도 사용률이 내려가지 않아 항상 maxReplicas 까지 올라간다.
# ============================================================

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-service-hpa
  namespace: auth-service
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: generic-service
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - { type: Pods, value: 1, periodSeconds: 60 }
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - { type: Pods, value: 1, periodSeconds: 60 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-service-pdb
  namespace: auth-service
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: generic-service

---
