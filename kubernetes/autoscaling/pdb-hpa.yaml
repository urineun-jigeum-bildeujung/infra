# ============================================================
# Karpenter Overprovisioning (전역, kube-system에 유지)
# dev 에서는 CPU 1 / 메모리 1Gi 더미 파드 2개가 노드를 추가로 띄울 수 있으니
# 필요 없으면 replicas 를 줄이거나 제거를 팀과 상의할 것.
# ============================================================
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: overprovisioning
value: -10
globalDefault: false
description: "빈 공간을 미리 확보해두는 더미 파드용 우선순위"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: overprovisioning
  namespace: kube-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: overprovisioning
  template:
    metadata:
      labels:
        app: overprovisioning
    spec:
      priorityClassName: overprovisioning
      terminationGracePeriodSeconds: 0
      nodeSelector:
        node-role: workload
      tolerations:
        - key: node-type
          operator: Equal
          value: on-demand
          effect: NoSchedule
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
          resources:
            requests:
              cpu: "1"
              memory: 1Gi