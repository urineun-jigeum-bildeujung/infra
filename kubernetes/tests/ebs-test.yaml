apiVersion: v1
kind: Namespace
metadata:
  name: ebs-test
  labels:
    app.kubernetes.io/name: ebs-test
    app.kubernetes.io/part-of: petflow
    environment: dev
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebs-test
  namespace: ebs-test
  labels:
    app.kubernetes.io/name: ebs-test
    app.kubernetes.io/part-of: petflow
    environment: dev
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: ebs-test
  namespace: ebs-test
  labels:
    app.kubernetes.io/name: ebs-test
    app.kubernetes.io/part-of: petflow
    environment: dev
spec:
  restartPolicy: Never
  containers:
    - name: ebs-test
      image: public.ecr.aws/docker/library/alpine:3.22
      command:
        - /bin/sh
        - -c
        - |
          set -eu
          echo "petflow EBS CSI test" > /data/result.txt
          cat /data/result.txt
          sleep 3600
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: ebs-test
