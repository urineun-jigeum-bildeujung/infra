apiVersion: v1
kind: Namespace
metadata:
  name: karpenter-scale-test
  labels:
    app.kubernetes.io/name: karpenter-scale-test
    app.kubernetes.io/part-of: petflow
    environment: dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karpenter-scale-test
  namespace: karpenter-scale-test
  labels:
    app.kubernetes.io/name: karpenter-scale-test
    app.kubernetes.io/part-of: petflow
    environment: dev
spec:
  replicas: 3
  selector:
    matchLabels:
      app: karpenter-scale-test
  template:
    metadata:
      labels:
        app: karpenter-scale-test
        app.kubernetes.io/name: karpenter-scale-test
        app.kubernetes.io/part-of: petflow
        environment: dev
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: workload
          image: public.ecr.aws/docker/library/alpine:3.22
          command:
            - /bin/sh
            - -c
            - sleep 3600
          resources:
            requests:
              cpu: 1500m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 512Mi
